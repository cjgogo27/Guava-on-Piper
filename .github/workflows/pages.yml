name: Publish visual evidence
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml', 'scripts/build_showcase_data.py', 'data/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build_showcase_data.py
      - run: node scripts/check_showcase.js
      - run: python scripts/check_showcase_assets.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
